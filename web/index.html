<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>ClassEcho</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #1a1a2e;
        background-image:
          radial-gradient(circle at 25% 25%, rgba(0, 149, 246, 0.06) 0%, transparent 50%),
          radial-gradient(circle at 75% 75%, rgba(0, 97, 163, 0.06) 0%, transparent 50%);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100%;
      }

      #root {
        width: 100%;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
